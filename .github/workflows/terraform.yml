name: Terraform Dev (us-east-1)

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'live/**'
      - 'terraform/modules/**'
      - 'terraform/bootstrap/**'
  pull_request:
    branches:
      - main
    paths:
      - 'live/**'
      - 'terraform/modules/**'
      - 'terraform/bootstrap/**'

permissions:
  contents: read    # to checkout code
  id-token: write      # needed for OIDC
  pull-requests: write # optional, if you want to comment on PR later

env:
  TF_IN_AUTOMATION: "true"

jobs:
  fmt-validate:
    name: Terraform fmt & validate (dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5  

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: live/dev/us-east-1
        run: |
          terraform init -backend=false
          terraform validate

  plan:
    name: Terraform plan (dev)
    runs-on: ubuntu-latest
    needs: fmt-validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform init
        working-directory: live/dev/us-east-1
        run: terraform init -input=false

      - name: Terraform plan
        id: plan
        working-directory: live/dev/us-east-1
        run: terraform plan -input=false -out=tfplan-dev

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: live/dev/us-east-1/tfplan-dev

  apply-dev:
    name: Terraform apply (dev)
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: live/dev/us-east-1

      - name: Terraform init
        working-directory: live/dev/us-east-1
        run: terraform init -input=false

      - name: Terraform apply (dev)
        working-directory: live/dev/us-east-1
        env:
          TF_VAR_argocd_gitops_pat: ${{ secrets.ARGO_GITOPS_PAT }}
        run: terraform apply -input=false tfplan-dev
        